<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic Trading Workflow</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #0f1a2e;
      --muted: #9fb0cc;
      --text: #e8eefc;
      --border: rgba(255,255,255,0.10);
      --accent: #7aa2ff;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: linear-gradient(180deg, #070b14 0%, var(--bg) 100%);
      color: var(--text);
    }
    .app {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 16px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .fullWidth {
      grid-column: 1 / -1;
    }
    .card {
      background: rgba(15, 26, 46, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      letter-spacing: 0.2px;
    }
    .subtle { color: var(--muted); font-size: 13px; margin: 0; }
    .row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; margin-top: 12px; }
    label { color: var(--muted); font-size: 13px; }
    select, button {
      width: 100%;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #17243d;
      color: var(--text);
      outline: none;
    }
    button {
      cursor: pointer;
      background: rgba(122,162,255,0.12);
      border-color: rgba(122,162,255,0.35);
    }
    button.secondary {
      background: rgba(255,255,255,0.06);
      border-color: var(--border);
    }
    .btnRow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .stack { display: grid; gap: 12px; }
    .sectionTitle { font-size: 13px; color: var(--muted); margin: 0 0 8px 0; }
    pre {
      margin: 0;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      overflow: auto;
      min-height: 120px;
      font-size: 12px;
      line-height: 1.45;
    }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .liveGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .liveBlock {
      background: rgba(0,0,0,0.28);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }
    .liveBlockTitle {
      margin: 0 0 8px 0;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .k { color: var(--muted); }
    .v { color: var(--text); word-break: break-word; }
    .liveWide { grid-column: 1 / -1; }
    select option {
      color: #101727;
      background: #f5f8ff;
    }
    #log {
      min-height: 240px;
      max-height: 360px;
    }
    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }
      .fullWidth {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Agentic Trading Workflow</h1>
      <p class="subtle">Demo control panel (delayed IB data)</p>

      <div class="row">
        <label for="ticker">Ticker</label>
        <select id="ticker">
          <option value="AAPL">AAPL</option>
          <option value="MSFT">MSFT</option>
        </select>
      </div>

      <div class="row">
        <label for="bar-interval">Interval</label>
        <select id="bar-interval">
          <option value="1m">1m</option>
          <option value="3m">3m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="30m">30m</option>
          <option value="45m">45m</option>
          <option value="1H">1H</option>
          <option value="2H">2H</option>
          <option value="3H">3H</option>
          <option value="4H">4H</option>
        </select>
      </div>

      <div class="btnRow">
        <button id="btn-start">Start</button>
        <button id="btn-stop" class="secondary">Stop</button>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <p class="sectionTitle">Session</p>
        <div id="session"></div>
      </div>

      <div class="card">
        <p class="sectionTitle">Indicators (all enabled)</p>
        <div id="indicators">
          <span class="pill">SMA</span>
          <span class="pill">RSI</span>
        </div>
      </div>

      <div class="card">
        <p class="sectionTitle">Live Data</p>
        <div id="output" class="liveGrid">
          <div class="liveBlock">
            <p class="liveBlockTitle">User Input</p>
            <div class="kv"><div class="k">Ticker</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Interval</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Status</div><div class="v">-</div></div>
          </div>
          <div class="liveBlock">
            <p class="liveBlockTitle">Live Tick</p>
            <div class="kv"><div class="k">Price</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Bid/Ask</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Volume</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Time</div><div class="v">-</div></div>
          </div>
          <div class="liveBlock liveWide">
            <p class="liveBlockTitle">Live Bar</p>
            <div class="kv"><div class="k">OHLC</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Volume</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Time</div><div class="v">-</div></div>
            <div class="kv"><div class="k">Source</div><div class="v">-</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card fullWidth">
      <p class="sectionTitle">Logs</p>
      <pre id="log">[ready] waiting for events...</pre>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
